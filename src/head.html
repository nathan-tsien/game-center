<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="application-name" content="游戏中心">

<meta name="theme-color" content="#ffb3d9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23ff6fae'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E">
<title>游戏中心</title>
<!-- 离线说明: 这是单文件应用, 没有外部依赖。若托管到网址并想"添加到主屏幕后完全离线", 需另加一个 sw.js (Service Worker) 缓存 index.html;
     单文件本身无法注册 Service Worker。本地打开(Documents 等 App)时无需 Service Worker。 -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
:root{--font:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Chalkboard SE","Marker Felt","PingFang SC","Microsoft YaHei",sans-serif;--ink:#3a2a5c}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
body{font-family:var(--font);color:var(--ink);background:#ffe9f4}
button,input{font-family:inherit}
#shell{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#view{flex:1;min-height:0;position:relative;overflow:hidden}
/* nav: candy buttons with icon + text */
#nav{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none;position:relative;z-index:16;overflow:visible}
.navfold{display:none;position:absolute;left:50%;bottom:0;transform:translate(-50%,62%);z-index:20;align-items:center;justify-content:center;gap:4px;
 min-width:110px;min-height:40px;padding:6px 16px 8px;border:3px solid #fff;border-radius:0 0 20px 20px;cursor:pointer;font-family:inherit;
 color:#fff;font-weight:900;font-size:14px;letter-spacing:.4px;line-height:1;
 background:linear-gradient(180deg,#ff8ec4 0%,#ff5fa8 100%);
 box-shadow:0 5px 0 #c44880,0 8px 12px rgba(60,30,90,.22),inset 0 2px 0 rgba(255,255,255,.4)}
.navfold svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.navfold:active{transform:translate(-50%,70%) scale(.96);box-shadow:0 2px 0 #c44880}
body:not([data-route=home]) .navfold{display:inline-flex}
body.nav-hid #nav{height:0;min-height:0;padding:0!important;margin:0;border:0;overflow:visible}
body.nav-hid #nav>:not(.navfold){display:none}
body.nav-hid .navfold{top:0;bottom:auto;transform:translate(-50%,0);border-radius:0 0 20px 20px}
body.nav-hid .navfold:active{transform:translate(-50%,4px) scale(.96)}
body.nav-hid #toast{top:calc(env(safe-area-inset-top) + 52px)}
@media (prefers-reduced-motion:reduce){.navfold{transition:none}}
#nav .ttl{flex:1;min-width:0;font-weight:900;font-size:21px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
#nav .ttl .tic{width:30px;height:30px;flex:none;display:inline-block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
#nav .ttl .tic svg{width:100%;height:100%}
#navslot{display:flex;gap:8px}
.nb{--nc:#7b5cf0;flex:none;position:relative;border:0;cursor:pointer;min-width:58px;height:56px;padding:4px 10px 3px;border-radius:20px;color:#fff;font-family:inherit;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
 background:linear-gradient(180deg,color-mix(in srgb,var(--nc) 78%,#fff) 0%,var(--nc) 100%);box-shadow:0 5px 0 color-mix(in srgb,var(--nc) 62%,#000),0 8px 10px rgba(60,30,90,.18),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .12s,box-shadow .12s,filter .12s}
.nb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nb span{font-size:12px;font-weight:900;line-height:1;letter-spacing:.5px;text-shadow:0 1px 0 rgba(0,0,0,.2);white-space:nowrap}
.nb:active,.nb.press{transform:translateY(4px) scale(.95,.92);box-shadow:0 1px 0 color-mix(in srgb,var(--nc) 62%,#000),inset 0 2px 0 rgba(255,255,255,.3)}
.nb.on{filter:brightness(1.08) saturate(1.2);outline:3px solid #fff}
.nb:disabled{opacity:.45}
.nb.home{--nc:#ff6fae}.nb.snd{--nc:#2bb673}.nb.snd.off{--nc:#9aa3b2}.nb.set{--nc:#ff9f1c}
#navslot .nb{--nc:#4a8fe0}#navslot .nb:nth-child(2n){--nc:#8e5ce0}#navslot .nb:nth-child(3n){--nc:#18a9b8}
body[data-route=home] #nHome{visibility:hidden}
.btn{border:0;border-radius:18px;background:#fff;color:#2a9d55;font-size:18px;font-weight:800;min-height:50px;padding:0 16px;box-shadow:0 4px 0 rgba(60,30,90,.2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;line-height:1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(60,30,90,.2)}
.btn.warn{color:#d33}.btn:disabled{opacity:.4}
.btn.sq{min-width:50px;padding:0;font-size:24px}
.btn.on{background:#ffb703;color:#fff}
.btn.big{font-size:26px;min-height:64px;background:#ff7a1f;color:#fff}
.btn.pri{background:#ff7a1f;color:#fff}
.row{display:flex;gap:8px;justify-content:center;padding:4px 0 8px}
.row .btn{flex:1;max-width:240px}
/* avatars */
.pls{display:flex;gap:8px;justify-content:center;align-items:center;min-height:58px;flex-wrap:wrap}
.pl{width:50px;height:58px;border-radius:16px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;transition:.2s;border:3px solid transparent;cursor:pointer}
.pl.on{background:#fff;border-color:#ffb703;transform:scale(1.15);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.pl svg{width:34px;height:42px}
.pl.plane svg,.pl.disc svg{width:40px;height:40px}
.hs{width:17px;height:17px;vertical-align:-3px}.ht{width:24px;height:24px;vertical-align:-5px}
/* toast + modal */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 78px);transform:translate(-50%,-24px) scale(.92);background:var(--ink);color:#fff;padding:12px 20px;border-radius:22px;font-size:19px;font-weight:800;opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.3,1.5,.5,1),opacity .25s;z-index:60;text-align:center;max-width:90vw;display:flex;align-items:center;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.18),0 12px 24px rgba(0,0,0,.25);border:3px solid #fff}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast .ti{width:28px;height:28px;flex:none;border-radius:50%;background:#ffb703;color:#fff;display:inline-flex;align-items:center;justify-content:center}
#toast .ti svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#toast .ti.warn{background:#ff5a4d}#toast .ti.check,#toast .ti.snd{background:#2bb673}#toast .ti.info{background:#4a8fe0}#toast .ti.star{background:#ff6fae}#toast .ti.mute{background:#9aa3b2}
#modal{position:fixed;inset:0;background:rgba(40,20,70,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.show{display:flex}
@keyframes mfade{from{opacity:0}to{opacity:1}}
#box{background:#fff;border-radius:28px;padding:20px;width:min(94vw,460px);max-height:92vh;max-height:calc(100dvh - 24px);overflow:auto;text-align:center;-webkit-overflow-scrolling:touch;box-shadow:0 14px 0 rgba(60,30,90,.18),0 20px 40px rgba(0,0,0,.3);border:4px solid #fff}
#box.mpopin{animation:mpop .32s cubic-bezier(.3,1.4,.5,1)}
#modal.show.mfadein{animation:mfade .2s}
/* v30: sticky/deed backdrop — never fade from 0 (board flash under dim) */
#modal.show.mfadein.msoft{animation:mfadeSoft .18s ease-out}
@keyframes mfadeSoft{from{opacity:.9}to{opacity:1}}
/* v27: sticky buy/deed — no opacity-0 pop (avoids white flash over the board) */
#box.deedm.mpopin,#box.sticky.mpopin{animation:mpopSoft .28s cubic-bezier(.25,1.05,.4,1)}
@keyframes mpopSoft{from{transform:translateY(8px) scale(.98);opacity:.94}to{transform:none;opacity:1}}
@keyframes mpop{from{transform:translateY(24px) scale(.88);opacity:0}to{transform:none;opacity:1}}
#box h2{margin:0 0 6px;font-size:26px}#box p{margin:6px 0 14px;font-size:17px;color:#6a5a8a}
#box .row .btn{background:#f1ecff;color:#5a3ea0}
#box .row .btn.pri{background:#ff7a1f;color:#fff}
#box .row .btn.warn{color:#d33}
#box textarea{width:100%;height:90px;border-radius:12px;border:2px solid #ddd;padding:8px;font-size:13px;font-family:monospace;user-select:text;-webkit-user-select:text}
.dlgic{width:60px;height:60px;border-radius:50%;margin:-6px auto 8px;background:linear-gradient(#8fb8ff,#4a8fe0);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #2f66b8}
.dlgic.bad{background:linear-gradient(#ff9a8f,#ef5a4d);box-shadow:0 5px 0 #b73328}
.dlgic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px;border-radius:14px;flex:none}
.coinf{position:fixed;left:0;top:0;width:28px;height:20px;pointer-events:none;z-index:80;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.coinf svg{width:100%;height:100%;overflow:visible}
#xf{position:fixed;display:none;z-index:70;pointer-events:none;overflow:hidden;display:none;align-items:center;justify-content:center}
#xf .xi{position:absolute;left:50%;top:50%;width:min(36vmin,200px);height:min(36vmin,200px);transform:translate(-50%,-50%);filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
#xf .xi svg{width:100%;height:100%}
.sv-r{animation:svr .34s cubic-bezier(.3,1,.4,1)}.sv-l{animation:svl .34s cubic-bezier(.3,1,.4,1)}.sv-f,.fadein{animation:mfade .35s}
@keyframes svr{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes svl{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
/* character select */
.selv{position:absolute;inset:0;z-index:30;background:linear-gradient(#bfe6ff,#fff0f8 55%,#fff4c9);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 20px;display:flex;flex-direction:column;align-items:center}
.selv.out{animation:selout .26s ease-in forwards}
@keyframes selout{to{transform:translateX(-40px) scale(.96);opacity:0}}
.selh{text-align:center;margin:4px 0 8px}.selh h1{margin:0;font-size:clamp(28px,6vw,40px);font-weight:900;color:#ff4f9a;text-shadow:0 3px 0 #fff,0 5px 0 rgba(60,30,90,.15)}.selh p{margin:4px 0 0;font-size:16px;font-weight:800;color:#6a5a8a}
.selg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(100%,640px);margin:6px 0 12px}
.selg.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.selg{grid-template-columns:repeat(3,minmax(0,1fr))}.selg.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (orientation:landscape) and (max-height:560px){.selg{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.selg.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.selv{padding-top:2px}.selh{margin:0 0 2px}.selh h1{font-size:26px}.selh p{display:none}.tkav{width:54px!important;height:54px!important}}
.selg.small{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tkc{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tkb{position:relative;border:4px solid transparent;background:#fff;border-radius:24px;padding:10px 4px 8px;cursor:pointer;box-shadow:0 5px 0 rgba(60,30,90,.18);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;color:var(--ink);transition:transform .15s}
.tkc.on .tkb{border-color:var(--tc);transform:translateY(-3px) scale(1.04);background:#fffbe9;box-shadow:0 8px 0 rgba(60,30,90,.2),0 0 0 4px #fff}
.tkc.pick .tkav{animation:tkhop .5s}
@keyframes tkhop{0%{transform:scale(.8)}50%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.tkav{width:68px;height:68px}.tkav svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.tkn{font-weight:900;font-size:16px}
.tkbadge{position:absolute;top:-8px;right:-4px;width:30px;height:30px;border-radius:50%;background:var(--tc);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2);animation:mpop .3s}
.nf{--nfc:#ff7ab8;position:relative;display:flex;align-items:center;gap:2px;min-height:48px;width:100%;box-sizing:border-box;padding:0 4px 0 4px;background:#fff7e6;border:2.5px solid #f3dfc0;border-radius:999px;box-shadow:inset 0 3px 6px rgba(120,70,20,.16);transition:border-color .2s,box-shadow .25s,background .2s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.nf:focus-within{border-color:var(--nfc);background:#fff;transform:scale(1.03);box-shadow:inset 0 2px 4px rgba(120,70,20,.1),0 0 0 4px color-mix(in srgb,var(--nfc) 28%,transparent)}
.nf.has{background:#fffdf5;border-color:color-mix(in srgb,var(--nfc) 60%,#fff)}
.nfe,.nfx{flex:none;width:36px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;color:#b08a60;font-weight:900;font-family:inherit;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s,opacity .2s,transform .2s}
.nf:focus-within .nfe{color:var(--nfc);transform:rotate(-12deg)}
.nfx{opacity:0;pointer-events:none;transform:scale(.6);font-size:26px;color:#fff;background:#c9b49a;border-radius:50%;width:26px;height:26px;margin:0 3px;min-width:26px}
.nf.has .nfx{opacity:1;pointer-events:auto;transform:none}
.nfx:active{transform:scale(.85)}
.nfi{flex:1;min-width:0;width:0;height:44px;border:0;background:transparent;outline:0;font-size:16px;font-weight:800;color:#5a3a1a;text-align:left;padding:0 2px;font-family:inherit;user-select:text;-webkit-user-select:text;-webkit-appearance:none;appearance:none}
.nfi::placeholder{color:#c4ae92;font-weight:700}
.nfc{position:absolute;right:14px;bottom:-9px;font-size:11px;font-weight:900;color:#fff;background:var(--nfc);border-radius:9px;padding:1px 7px;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
.nf:focus-within .nfc{opacity:1;transform:none}.nfc.warn{background:#e0485e}
.nfp{flex:none;width:40px;height:40px;margin-left:2px}.nfpv,.nfpv svg{display:block;width:100%;height:100%;overflow:visible}
.nfhint{margin:10px 0;color:#a58;font-weight:800;font-size:14px}
#box .nf{margin:12px 0 14px}
.tkc .nf{margin-bottom:8px}.tkc .nfe{width:28px}.tkc .nfi{font-size:16px}
@media (prefers-reduced-motion:reduce){.nf,.nf *{transition:none!important}.nf:focus-within{transform:none}}
.self{position:sticky;bottom:0;padding:10px 0 4px;width:min(100%,420px);margin-top:auto}
.self .btn{width:100%;max-width:none}.self .btn small{font-size:14px;opacity:.85;margin-left:6px}
/* 飞行棋选角色时绑定飞机颜色（黄TL · 蓝TR · 红BL · 绿BR） */
.seatbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;width:min(100%,640px);margin:0 0 10px;padding:8px 10px;background:#fff8;border:3px solid #fff;border-radius:18px;box-shadow:0 4px 0 rgba(60,30,90,.12)}
.seatbar-l{font-weight:900;font-size:14px;color:#5a3ea0;text-align:center}
.seatbar-l b{color:#e0485e}
.seatbar-r{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seatsw{min-width:58px;height:52px;padding:4px 8px;border-radius:16px;border:3px solid #fff;background:var(--sc,#ccc);color:#fff;font-weight:900;font-size:18px;font-family:inherit;line-height:1.05;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.seatsw small{display:block;font-size:11px;font-weight:800;opacity:.92}
.seatsw.on{outline:3px solid #5a3ea0;outline-offset:2px;transform:scale(1.08)}
.seatsw.taken{opacity:.38;filter:grayscale(.35);cursor:not-allowed;box-shadow:none}
.seatbar.need{box-shadow:0 0 0 3px #ffd23f,0 4px 0 rgba(60,30,90,.12);animation:seatneed 1s ease-in-out infinite}
@keyframes seatneed{50%{box-shadow:0 0 0 5px #ff9a40,0 4px 0 rgba(60,30,90,.12)}}
.tkseat{position:absolute;left:8px;bottom:6px;padding:2px 7px;border-radius:999px;background:#888;color:#fff;font-size:11px;font-weight:900;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tkseat.wait{background:#ff7a1f;animation:seatneed .9s ease-in-out infinite}
.tkc.focus .tkb{box-shadow:0 8px 0 rgba(60,30,90,.2),0 0 0 4px #fff,0 0 0 8px #ffd23f}
@media (orientation:landscape) and (max-height:560px){
 .selv.bindseat .selh p{display:block!important;font-size:13px;margin:0}
 .seatbar{margin:2px 0 6px;padding:6px 8px;gap:6px}
 .seatsw{min-width:48px;height:44px;font-size:15px}
 .tkseat{font-size:10px;left:4px;bottom:4px;padding:1px 5px}
}
.mplist{margin:8px 0}.mprow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:16px;background:#f7f4ff;margin:6px 0}.mprow .pl{flex:none;transform:none}.mpn{flex:1;text-align:left;font-weight:900;font-size:18px}.mpn small{display:block;font-size:12px;color:#8a7aaa}
.sec{margin:12px 0;text-align:left}
.sec h3{margin:0 0 6px;font-size:18px;color:#5a3ea0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:76px;min-height:52px;font-size:17px;background:#f1ecff;color:#5a3ea0;box-shadow:0 3px 0 rgba(60,30,90,.15)}
.seg .btn.on{background:#ff7a1f;color:#fff}
.tg{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:19px;font-weight:800;min-height:52px}
.tg .btn{min-width:84px}
.prow{display:flex;align-items:center;gap:8px;margin:6px 0}
.prow .pl{flex:none;opacity:.45}.prow .pl.on{opacity:1;transform:none}
.prow .nf{flex:1;min-width:0;width:auto}
/* ===== home ===== */
#home{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:linear-gradient(#9fe3ff 0%,#d6f3ff 38%,#ffeaf5 70%,#fff4c9 100%)}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;left:-30%;width:150px;height:60px;opacity:.9;animation:drift linear infinite}
.cloud svg{width:100%;height:100%}
@keyframes drift{to{transform:translateX(160vw)}}
.star{position:absolute;width:26px;height:26px;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(25deg);opacity:1}}
.balloon{position:absolute;bottom:-120px;width:44px;height:70px;animation:rise linear infinite}
.balloon svg{width:100%;height:100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes rise{to{transform:translateY(-130vh)}}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.hub{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:6px 16px 28px}
.hero{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
#mascot{width:clamp(96px,22vw,170px);flex:none;cursor:pointer;overflow:visible}
#mascot.hop{animation:hop .6s}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-22px) scale(1.05,.95)}}
.ear{transform-origin:50% 100%;transform-box:fill-box;animation:ear 3s ease-in-out infinite}
.ear.r{animation-delay:.5s}
@keyframes ear{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-9deg)}95%{transform:rotate(7deg)}}
.lid{transform-origin:50% 50%;transform-box:fill-box;transform:scaleY(0);animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.arm{transform-origin:20% 90%;transform-box:fill-box;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(26deg)}}

/* ===== shared game frame ===== */
.gm{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 10px 6px;gap:8px;min-height:0}

#dstage{cursor:pointer;gap:var(--gap,16px);flex-wrap:nowrap;position:relative}

.cc{flex:1;text-align:center}

.cc .n{display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px;font-weight:900}
