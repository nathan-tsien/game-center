<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="游戏中心">
<meta name="application-name" content="游戏中心">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffb3d9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d6efff'/%3E%3Cpath d='M26 58c0-5 2-9 7-10 3-1 6-1 9-1h16c3 0 6 0 9 1 5 1 7 5 7 10 0 6 1 12 2 17 1 8-3 11-7 11-7 0-8-5-9-9-1-4-4-6-8-6s-7 2-8 6c-1 4-2 9-9 9-4 0-8-3-7-11 1-5 2-11 2-17Z' fill='%23fff' stroke='%233b3f4a' stroke-width='2.5' stroke-linejoin='round'/%3E%3Crect x='38' y='46' width='5' height='11' rx='2' fill='%233a7bff'/%3E%3Crect x='34' y='49' width='12' height='5' rx='2' fill='%233a7bff'/%3E%3Ccircle cx='63' cy='48' r='3' fill='%233fd489'/%3E%3Ccircle cx='58' cy='54' r='3' fill='%23ffcf3f'/%3E%3Ccircle cx='68' cy='54' r='3' fill='%23ff5b5b'/%3E%3C/svg%3E">
<title>游戏中心</title>
<!-- 离线说明: 这是单文件应用, 没有外部依赖。若托管到网址并想"添加到主屏幕后完全离线", 需另加一个 sw.js (Service Worker) 缓存 index.html;
     单文件本身无法注册 Service Worker。本地打开(Documents 等 App)时无需 Service Worker。 -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
:root{--font:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Chalkboard SE","Marker Felt","PingFang SC","Microsoft YaHei",sans-serif;--ink:#3a2a5c}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
body{font-family:var(--font);color:var(--ink);background:#ffe9f4}
button,input{font-family:inherit}
#shell{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#view{flex:1;min-height:0;position:relative;overflow:hidden}
/* nav: candy buttons with icon + text */
#nav{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none;position:relative;z-index:5}
#nav .ttl{flex:1;min-width:0;font-weight:900;font-size:21px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
#nav .ttl .tic{width:30px;height:30px;flex:none;display:inline-block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
#nav .ttl .tic svg{width:100%;height:100%}
#navslot{display:flex;gap:8px}
.nb{--nc:#7b5cf0;flex:none;position:relative;border:0;cursor:pointer;min-width:58px;height:56px;padding:4px 10px 3px;border-radius:20px;color:#fff;font-family:inherit;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
 background:linear-gradient(180deg,color-mix(in srgb,var(--nc) 78%,#fff) 0%,var(--nc) 100%);box-shadow:0 5px 0 color-mix(in srgb,var(--nc) 62%,#000),0 8px 10px rgba(60,30,90,.18),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .12s,box-shadow .12s,filter .12s}
.nb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nb span{font-size:12px;font-weight:900;line-height:1;letter-spacing:.5px;text-shadow:0 1px 0 rgba(0,0,0,.2);white-space:nowrap}
.nb:active,.nb.press{transform:translateY(4px) scale(.95,.92);box-shadow:0 1px 0 color-mix(in srgb,var(--nc) 62%,#000),inset 0 2px 0 rgba(255,255,255,.3)}
.nb.on{filter:brightness(1.08) saturate(1.2);outline:3px solid #fff}
.nb:disabled{opacity:.45}
.nb.home{--nc:#ff6fae}.nb.snd{--nc:#2bb673}.nb.snd.off{--nc:#9aa3b2}.nb.set{--nc:#ff9f1c}
#navslot .nb{--nc:#4a8fe0}#navslot .nb:nth-child(2n){--nc:#8e5ce0}#navslot .nb:nth-child(3n){--nc:#18a9b8}
body[data-route=home] #nHome{visibility:hidden}
.btn{border:0;border-radius:18px;background:#fff;color:#2a9d55;font-size:18px;font-weight:800;min-height:50px;padding:0 16px;box-shadow:0 4px 0 rgba(60,30,90,.2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;line-height:1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(60,30,90,.2)}
.btn.warn{color:#d33}.btn:disabled{opacity:.4}
.btn.sq{min-width:50px;padding:0;font-size:24px}
.btn.on{background:#ffb703;color:#fff}
.btn.big{font-size:26px;min-height:64px;background:#ff7a1f;color:#fff}
.btn.pri{background:#ff7a1f;color:#fff}
.row{display:flex;gap:8px;justify-content:center;padding:4px 0 8px}
.row .btn{flex:1;max-width:240px}
/* avatars */
.pls{display:flex;gap:8px;justify-content:center;align-items:center;min-height:58px;flex-wrap:wrap}
.pl{width:50px;height:58px;border-radius:16px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;transition:.2s;border:3px solid transparent;cursor:pointer}
.pl.on{background:#fff;border-color:#ffb703;transform:scale(1.15);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.pl svg{width:34px;height:42px}
.pl.plane svg,.pl.disc svg{width:40px;height:40px}
.hs{width:17px;height:17px;vertical-align:-3px}.ht{width:24px;height:24px;vertical-align:-5px}
/* toast + modal */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 78px);transform:translate(-50%,-24px) scale(.92);background:var(--ink);color:#fff;padding:12px 20px;border-radius:22px;font-size:19px;font-weight:800;opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.3,1.5,.5,1),opacity .25s;z-index:60;text-align:center;max-width:90vw;display:flex;align-items:center;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.18),0 12px 24px rgba(0,0,0,.25);border:3px solid #fff}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast .ti{width:28px;height:28px;flex:none;border-radius:50%;background:#ffb703;color:#fff;display:inline-flex;align-items:center;justify-content:center}
#toast .ti svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#toast .ti.warn{background:#ff5a4d}#toast .ti.check,#toast .ti.snd{background:#2bb673}#toast .ti.info{background:#4a8fe0}#toast .ti.star{background:#ff6fae}#toast .ti.mute{background:#9aa3b2}
#modal{position:fixed;inset:0;background:rgba(40,20,70,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.show{display:flex;animation:mfade .2s}
@keyframes mfade{from{opacity:0}to{opacity:1}}
#box{background:#fff;border-radius:28px;padding:20px;width:min(94vw,460px);max-height:92vh;max-height:calc(100dvh - 24px);overflow:auto;text-align:center;-webkit-overflow-scrolling:touch;animation:mpop .32s cubic-bezier(.3,1.4,.5,1);box-shadow:0 14px 0 rgba(60,30,90,.18),0 20px 40px rgba(0,0,0,.3);border:4px solid #fff}
@keyframes mpop{from{transform:translateY(24px) scale(.88);opacity:0}to{transform:none;opacity:1}}
#box h2{margin:0 0 6px;font-size:26px}#box p{margin:6px 0 14px;font-size:17px;color:#6a5a8a}
#box .row .btn{background:#f1ecff;color:#5a3ea0}
#box .row .btn.pri{background:#ff7a1f;color:#fff}
#box .row .btn.warn{color:#d33}
#box textarea{width:100%;height:90px;border-radius:12px;border:2px solid #ddd;padding:8px;font-size:13px;font-family:monospace;user-select:text;-webkit-user-select:text}
.dlgic{width:60px;height:60px;border-radius:50%;margin:-6px auto 8px;background:linear-gradient(#8fb8ff,#4a8fe0);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #2f66b8}
.dlgic.bad{background:linear-gradient(#ff9a8f,#ef5a4d);box-shadow:0 5px 0 #b73328}
.dlgic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px;border-radius:14px;flex:none}
.coinf{position:fixed;left:0;top:0;width:28px;height:20px;pointer-events:none;z-index:80;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.coinf svg{width:100%;height:100%;overflow:visible}
#xf{position:fixed;display:none;z-index:70;pointer-events:none;overflow:hidden;display:none;align-items:center;justify-content:center}
#xf .xi{position:absolute;left:50%;top:50%;width:min(36vmin,200px);height:min(36vmin,200px);transform:translate(-50%,-50%);filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
#xf .xi svg{width:100%;height:100%}
.sv-r{animation:svr .34s cubic-bezier(.3,1,.4,1)}.sv-l{animation:svl .34s cubic-bezier(.3,1,.4,1)}.sv-f,.fadein{animation:mfade .35s}
@keyframes svr{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes svl{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
/* character select */
.selv{position:absolute;inset:0;z-index:30;background:linear-gradient(#bfe6ff,#fff0f8 55%,#fff4c9);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 20px;display:flex;flex-direction:column;align-items:center}
.selv.out{animation:selout .26s ease-in forwards}
@keyframes selout{to{transform:translateX(-40px) scale(.96);opacity:0}}
.selh{text-align:center;margin:4px 0 8px}.selh h1{margin:0;font-size:clamp(28px,6vw,40px);font-weight:900;color:#ff4f9a;text-shadow:0 3px 0 #fff,0 5px 0 rgba(60,30,90,.15)}.selh p{margin:4px 0 0;font-size:16px;font-weight:800;color:#6a5a8a}
.selg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(100%,640px);margin:6px 0 12px}
.selg.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.selg{grid-template-columns:repeat(3,minmax(0,1fr))}.selg.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (orientation:landscape) and (max-height:560px){.selg{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.selg.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.selv{padding-top:2px}.selh{margin:0 0 2px}.selh h1{font-size:26px}.selh p{display:none}.tkav{width:54px!important;height:54px!important}}
.selg.small{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tkc{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tkb{position:relative;border:4px solid transparent;background:#fff;border-radius:24px;padding:10px 4px 8px;cursor:pointer;box-shadow:0 5px 0 rgba(60,30,90,.18);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;color:var(--ink);transition:transform .15s}
.tkc.on .tkb{border-color:var(--tc);transform:translateY(-3px) scale(1.04);background:#fffbe9;box-shadow:0 8px 0 rgba(60,30,90,.2),0 0 0 4px #fff}
.tkc.pick .tkav{animation:tkhop .5s}
@keyframes tkhop{0%{transform:scale(.8)}50%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.tkav{width:68px;height:68px}.tkav svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.tkn{font-weight:900;font-size:16px}
.tkbadge{position:absolute;top:-8px;right:-4px;width:30px;height:30px;border-radius:50%;background:var(--tc);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2);animation:mpop .3s}
.nf{--nfc:#ff7ab8;position:relative;display:flex;align-items:center;gap:2px;min-height:48px;width:100%;box-sizing:border-box;padding:0 4px 0 4px;background:#fff7e6;border:2.5px solid #f3dfc0;border-radius:999px;box-shadow:inset 0 3px 6px rgba(120,70,20,.16);transition:border-color .2s,box-shadow .25s,background .2s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.nf:focus-within{border-color:var(--nfc);background:#fff;transform:scale(1.03);box-shadow:inset 0 2px 4px rgba(120,70,20,.1),0 0 0 4px color-mix(in srgb,var(--nfc) 28%,transparent)}
.nf.has{background:#fffdf5;border-color:color-mix(in srgb,var(--nfc) 60%,#fff)}
.nfe,.nfx{flex:none;width:36px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;color:#b08a60;font-weight:900;font-family:inherit;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s,opacity .2s,transform .2s}
.nf:focus-within .nfe{color:var(--nfc);transform:rotate(-12deg)}
.nfx{opacity:0;pointer-events:none;transform:scale(.6);font-size:26px;color:#fff;background:#c9b49a;border-radius:50%;width:26px;height:26px;margin:0 3px;min-width:26px}
.nf.has .nfx{opacity:1;pointer-events:auto;transform:none}
.nfx:active{transform:scale(.85)}
.nfi{flex:1;min-width:0;width:0;height:44px;border:0;background:transparent;outline:0;font-size:16px;font-weight:800;color:#5a3a1a;text-align:left;padding:0 2px;font-family:inherit;user-select:text;-webkit-user-select:text;-webkit-appearance:none;appearance:none}
.nfi::placeholder{color:#c4ae92;font-weight:700}
.nfc{position:absolute;right:14px;bottom:-9px;font-size:11px;font-weight:900;color:#fff;background:var(--nfc);border-radius:9px;padding:1px 7px;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
.nf:focus-within .nfc{opacity:1;transform:none}.nfc.warn{background:#e0485e}
.nfp{flex:none;width:40px;height:40px;margin-left:2px}.nfpv,.nfpv svg{display:block;width:100%;height:100%;overflow:visible}
.nfhint{margin:10px 0;color:#a58;font-weight:800;font-size:14px}
#box .nf{margin:12px 0 14px}
.tkc .nf{margin-bottom:8px}.tkc .nfe{width:28px}.tkc .nfi{font-size:16px}
@media (prefers-reduced-motion:reduce){.nf,.nf *{transition:none!important}.nf:focus-within{transform:none}}
.self{position:sticky;bottom:0;padding:10px 0 4px;width:min(100%,420px);margin-top:auto}
.self .btn{width:100%;max-width:none}.self .btn small{font-size:14px;opacity:.85;margin-left:6px}
.mplist{margin:8px 0}.mprow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:16px;background:#f7f4ff;margin:6px 0}.mprow .pl{flex:none;transform:none}.mpn{flex:1;text-align:left;font-weight:900;font-size:18px}.mpn small{display:block;font-size:12px;color:#8a7aaa}
.sec{margin:12px 0;text-align:left}
.sec h3{margin:0 0 6px;font-size:18px;color:#5a3ea0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:76px;min-height:52px;font-size:17px;background:#f1ecff;color:#5a3ea0;box-shadow:0 3px 0 rgba(60,30,90,.15)}
.seg .btn.on{background:#ff7a1f;color:#fff}
.tg{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:19px;font-weight:800;min-height:52px}
.tg .btn{min-width:84px}
.prow{display:flex;align-items:center;gap:8px;margin:6px 0}
.prow .pl{flex:none;opacity:.45}.prow .pl.on{opacity:1;transform:none}
.prow .nf{flex:1;min-width:0;width:auto}
/* ===== home ===== */
#home{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:linear-gradient(#9fe3ff 0%,#d6f3ff 38%,#ffeaf5 70%,#fff4c9 100%)}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;left:-30%;width:150px;height:60px;opacity:.9;animation:drift linear infinite}
.cloud svg{width:100%;height:100%}
@keyframes drift{to{transform:translateX(160vw)}}
.star{position:absolute;width:26px;height:26px;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(25deg);opacity:1}}
.balloon{position:absolute;bottom:-120px;width:44px;height:70px;animation:rise linear infinite}
.balloon svg{width:100%;height:100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes rise{to{transform:translateY(-130vh)}}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.hub{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:6px 16px 28px}
.hero{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
#mascot{width:clamp(96px,22vw,170px);flex:none;cursor:pointer;overflow:visible}
#mascot.hop{animation:hop .6s}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-22px) scale(1.05,.95)}}
.ear{transform-origin:50% 100%;transform-box:fill-box;animation:ear 3s ease-in-out infinite}
.ear.r{animation-delay:.5s}
@keyframes ear{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-9deg)}95%{transform:rotate(7deg)}}
.lid{transform-origin:50% 50%;transform-box:fill-box;transform:scaleY(0);animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.arm{transform-origin:20% 90%;transform-box:fill-box;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(26deg)}}
.bubble{position:relative;background:#fff;border-radius:22px;padding:6px 14px;font-weight:900;font-size:20px;box-shadow:0 4px 0 rgba(60,30,90,.15);opacity:0;transform:scale(.6);transition:.25s;white-space:nowrap}
.bubble.show{opacity:1;transform:none}
.hero h1{margin:0;font-size:clamp(40px,9vw,76px);font-weight:900;line-height:1.1;letter-spacing:2px;white-space:nowrap}
.hero h1 span{display:inline-block;animation:letter 2.2s ease-in-out infinite;text-shadow:0 4px 0 #fff,0 7px 0 rgba(60,30,90,.18)}
@keyframes letter{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.tiles{display:grid;grid-template-columns:1fr;gap:18px}
.tile{position:relative;border:0;border-radius:34px;background:var(--c);color:#fff;font-family:inherit;cursor:pointer;min-height:104px;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 8px 0 rgba(60,30,90,.22),inset 0 -8px 0 rgba(0,0,0,.08),inset 0 6px 0 rgba(255,255,255,.28);animation:tbounce 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.tile:active{animation:none;transform:translateY(6px) scale(.97);box-shadow:0 2px 0 rgba(60,30,90,.22)}
.tile.popped{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes tbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tile .ic{flex:none;width:84px;height:84px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.15));animation:wob 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.tile:nth-child(3n+2) .ic{animation-name:floaty}
.tile:nth-child(3n+3) .ic{animation-name:spin}
.ic svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes spin{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.1) rotate(4deg)}}
.tile .nm{font-size:clamp(28px,5vw,38px);font-weight:900;line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.tile .ds{font-size:clamp(16px,2.6vw,20px);font-weight:800;opacity:.92;margin-top:2px}
.tile.soon{background:#c9bfe0;animation:none;cursor:default}
.tile.soon .ic{animation:sway2 4s ease-in-out infinite;filter:grayscale(.35) drop-shadow(0 5px 0 rgba(0,0,0,.12))}
@keyframes sway2{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(3px)}}
.tile .rb{position:absolute;top:10px;right:12px;background:#fff;color:#8a6cc2;border-radius:16px;padding:4px 12px;font-size:16px;font-weight:900;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.tile .zz{position:absolute;right:24px;bottom:50%;font-size:26px;font-weight:900;color:#fff;opacity:0;animation:zz 3s ease-in infinite}
.tile .zz.b{animation-delay:1.1s;font-size:20px;right:50px}
@keyframes zz{0%{transform:translate(0,20px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translate(14px,-32px) scale(1.2);opacity:0}}

.gm{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 10px 6px;gap:8px;min-height:0}
.gm-cards{background:linear-gradient(#bfe6ff,#e8f7ff 40%,#7fcf6a 40.1%,#3f9b3a)}
.gm-dice{background:linear-gradient(#ffe2a8,#fff1d6 45%,#ffc4de)}

.turn{font-size:20px;font-weight:900;text-align:center;min-height:26px}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cntbox{align-self:center;background:#fff;border-radius:18px;padding:5px 16px;font-weight:900;font-size:18px;text-align:center;line-height:1.2;box-shadow:0 4px 0 rgba(60,30,90,.2)}

/* cards */
.gm-cards .stage{perspective:1200px}
#card{height:100%;max-height:560px;aspect-ratio:3/4;max-width:100%;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
#card.back{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:6%/5%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.35);border:5px solid #fff;background:#fff}
.face.bk{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#ff9a3c 0 14px,#ffb25e 14px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.bk .t{font-size:clamp(34px,9vw,56px);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.bk .s{font-size:clamp(16px,4vw,24px);margin-top:10px;font-weight:700}
.bk svg{width:40%}
.face.fr svg.art{width:100%;height:100%;display:block}

#hist .h svg{width:100%;height:100%;display:block}
#hist .h:first-child{opacity:1;outline:3px solid #ffb703}

#dstage{cursor:pointer;gap:var(--gap,16px);flex-wrap:nowrap;position:relative}

.cnt{display:flex;gap:6px;align-items:center;justify-content:center}

.cc{flex:1;text-align:center}

.cc .n{display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px;font-weight:900}

 var DEF={takeoff:'56',again6:true,three:'one'};
 /* pure: s={turn,sixes,rules}, n players, v roll -> result */
 function resolve(s,n,v){
  var r=s.rules,sixes=v===6?s.sixes+1:0,pen=null;
  if(r.again6&&r.three!=='off'&&sixes>=3)pen=r.three;
  var takeoff=TAKEOFF[r.takeoff].indexOf(v)>=0;
  var again=!pen&&v===6&&r.again6;
  var turn=again?s.turn:(s.turn+1)%n;
  if(!again)sixes=0;
  var hint,kind;
  if(pen){kind='warn';hint=pen==='all'?'⚠️ 连续三个6!所有飞机都要回基地!这次不走,换下一位':'⚠️ 连续三个6!有一架飞机要回基地!这次不走,换下一位'}
  else if(takeoff&&again){kind='again';hint='掷到'+v+',可以起飞!再掷一次!'}
  else if(takeoff){kind='good';hint='掷到'+v+',可以起飞!走完换下一位'}
  else if(again){kind='again';hint='掷到6,再掷一次!'}
  else{kind='';hint='没到起飞点数,换下一位'}
  var sub=(!pen&&!takeoff)?'已在天上的飞机可走 '+v+' 步':(!pen&&takeoff?'或让天上的飞机走 '+v+' 步':'');

 }

 var f=finState(S,p.id);if(!f)return;
 if(f.id==='danger')say(S,p.id,'stillDanger');
 else if(f.level>=FIN_ORDER.rich){p.fb=(p.fb||0)+1;if(p.fb%3===1)say(S,p.id,'richBoast')}
}
function luckyAvail(S,pid){var p=P(S,pid);return !!(p&&!p.out&&S.cfg.luckyRoll!==false&&!p.lucky)}
/* ---------- compat / helpers ---------- */
var OLDNAMES={'小男孩':'不不奥特曼','双马尾':'哎呀公主','红发妹':'温柔喷火龙','眼镜娃':'猪肉战神','双马尾女孩':'哎呀公主','红发女':'温柔喷火龙','眼镜男':'猪肉战神'};
var TKN=['小狗','小狮子','不不奥特曼','哎呀公主','温柔喷火龙','猪肉战神'];
function normalize(S){ // make an older saved state (v6 and before) usable
 S.cfg=Object.assign({},DEF_CFG,S.cfg||{});
 if(typeof S.rr!=='number')S.rr=0;
 if(typeof S.round!=='number'||S.round<1)S.round=1;
 if(!S.ev)S.ev=[];if(!S.log)S.log=[];if(!S.fs||typeof S.fs!=='object')S.fs={};
 (S.players||[]).forEach(function(p){if(OLDNAMES[p.name])p.name=OLDNAMES[p.name];if(typeof p.lucky!=='number')p.lucky=0;if(typeof p.fb!=='number')p.fb=0;if(!Array.isArray(p.ack))p.ack=[]});
 if(S.phase==='play')finInit(S);
 return S;
}
function rerollsLeft(S){var m=+S.cfg.maxRerolls;if(m<0)return -1;return Math.max(0,m-(S.rr||0))}
function canReroll(S){
 if(S.phase!=='play'||S.tp!=='rolled'||S.pend||!S.roll)return false;
 if(S.roll.forced||S.roll.slow)return false;
 var l=rerollsLeft(S);return l<0||l>0;
}
function liquid(S,pid){var t=0;Object.keys(S.props).forEach(function(n){var q=S.props[n];if(q.owner===pid&&!q.mort)t+=deed(S,n).mortgage});return t}
function buildSpent(S,n){var q=S.props[n],d=deed(S,n),t=0;for(var l=1;l<=q.lvl;l++)t+=d.build[l===4?1:0];return t}
/* 净资产 = 现金 + 地价 + 已建房费 - 抵押中需要赎回的钱 */
function netWorth(S,pid){var p=P(S,pid),r={cash:p.cash,land:0,build:0,debt:0,props:0};
 Object.keys(S.props).forEach(function(n){var q=S.props[n];if(q.owner!==pid)return;var d=deed(S,n);r.props++;r.land+=d.price;r.build+=buildSpent(S,n);if(q.mort)r.debt+=d.redeem});
 r.total=r.cash+r.land+r.build-r.debt;return r}
function standings(S){return S.players.filter(function(p){return !p.out}).map(function(p){var w=netWorth(S,p.id);return{pid:p.id,name:p.name,tok:p.tok,cash:w.cash,props:w.props,total:w.total,w:w}}).sort(function(a,b){return (b.cash-a.cash)||(b.total-a.total)||(b.props-a.props)})}
function say(S,pid,type,x){ev(S,{k:'say',pid:pid,type:type,x:x||null})}
function P(S,id){for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return S.players[i];return null}
function active(S){return S.players.filter(function(p){return !p.out})}
function log(S,t,k){S.log.push({t:t,k:k||''});if(S.log.length>120)S.log.shift()}
function card(n){return DATA.chance[n-1]}
function pname(S,id){var p=P(S,id);return p?p.name:'?'}
function ev(S,e){S.ev.push(e)}
/* money: from/to = pid | 'bank' | 'pot' */
function xfer(S,from,to,amt,why){
 amt=Math.round(amt);if(!(amt>0))return true;
 if(typeof from==='number'){var a=P(S,from);if(a.cash<amt)return false;a.cash-=amt}else if(from==='bank')S.bankOut+=amt;else if(from==='pot'){if(S.pot<amt)return false;S.pot-=amt}
 if(typeof to==='number')P(S,to).cash+=amt;else if(to==='bank')S.bankOut-=amt;else if(to==='pot')S.pot+=amt;
 ev(S,{k:'coin',from:from,to:to,amt:amt,why:why||''});
 return true;
}
function invariant(S){var s=S.pot;S.players.forEach(function(p){s+=p.cash});return s===S.bankOut}
function totalAssets(S,pid){var p=P(S,pid),t=p.cash;Object.keys(S.props).forEach(function(n){var q=S.props[n];if(q.owner===pid){var d=deed(S,n);t+=q.mort?0:d.price}});return t}
function ownedBy(S,pid){return Object.keys(S.props).filter(function(n){return S.props[n].owner===pid}).sort(function(a,b){return DATA.deeds[a].sq-DATA.deeds[b].sq})}
/* ---------- rent ---------- */
function rentFor(S,name){
 var q=S.props[name],d=deed(S,name),base=d.rent[q.lvl],mult=1;
 if(q.owner!=null){var all=groupMembers(S,name).every(function(m){return S.props[m].owner===q.owner});if(all)mult=2}
 return{base:base,mult:mult,amount:base*mult,lvl:q.lvl}
}
var LVN=['空地','1间民宿','2间民宿','3间民宿','度假村'];
/* ---------- players ---------- */
function mkPlayer(S,name,tok){return{id:S.nid++,name:name||'',tok:tok,cash:0,pos:0,from:null,hand:[],rest:0,sleep:0,seal:0,slow:0,rev:0,forced:0,out:false,lucky:0,fb:0,dr:-9,ack:[],ackD:false}}
function addPlayer(S,name,tok,withMoney){
 if(active(S).length>=6)return{ok:false,err:'满员(最多6位)'};
 if(tok==null||tok<0||tok>5)return{ok:false,err:'请选择角色'};
 if(active(S).some(function(p){return p.tok===tok}))return{ok:false,err:'这个角色已被选走'};
 var p=mkPlayer(S,name,tok);p.name=(name||'').trim()||('玩家'+(S.players.length+1));S.players.push(p);
 if(withMoney!==false)xfer(S,'bank',p.id,S.cfg.start,'start');
 return{ok:true,id:p.id};
}
function startGame(S,list,firstIdx){
 S.players=[];S.nid=1;S.bankOut=0;S.pot=0;
 for(var i=0;i<list.length;i++){var r=addPlayer(S,list[i].name,list[i].tok);if(!r.ok)return r}
 if(S.players.length<2)return{ok:false,err:'至少 2 位玩家'};
 S.phase='play';S.round=1;S.rr=0;S.turn=S.players[Math.min(firstIdx||0,S.players.length-1)].id;S.tp='roll';S.roll=null;S.q=[];S.pend=null;S.again=false;S.winner=null;
 S.players.forEach(function(p){p.from=0});S.fs={};finInit(S);
 log(S,'游戏开始! 每位玩家 ¥'+S.cfg.start,'good');S.ev=[];return{ok:true}
}
function sync(S){S.pend=S.q[0]||null}
function push(S,p){S.q.push(p);sync(S)}
function pushFront(S,p){S.q.unshift(p);sync(S)}
function cur(S){return P(S,S.turn)}
/* ---------- deck ---------- */
function drawCard(S){
 var d=S.deck;if(!d.q.length){d.q=shuffle(d.disc.slice());d.disc=[]}
 if(!d.q.length)return null;return d.q.shift();
}
function releaseCard(S,n){S.players.forEach(function(q){if(q.ack){var i=q.ack.indexOf(n);if(i>=0)q.ack.splice(i,1)}});if(S.cfg.deckMode==='reshuffle')S.deck.disc.push(n);else S.deck.q.push(n)}
/* ---------- movement ---------- */
function movePlayer(S,p,steps,dir){
 var path=[],passed=0,passHotel=false;
 for(var k=1;k<=steps;k++){p.pos=(p.pos+dir+N)%N;path.push(p.pos);if(dir>0&&p.pos===0)passed++;if(p.pos===29&&k<steps)passHotel=true}
 ev(S,{k:'move',pid:p.id,path:path});
 return{path:path,passed:passed,passHotel:passHotel};
}
function jump(S,p,to){p.pos=to;ev(S,{k:'jump',pid:p.id,to:to})}
function prevCity(pos){for(var i=1;i<N;i++){var q=(pos-i+N)%N;if(DATA.squares[q].type==='property')return q}return pos}
/* ---------- landing ---------- */
function landOn(S,p,pos,o){
 o=o||{};var sq=DATA.squares[pos],t=sq.type,name=sq.name;
 if(t==='property'){
  var q=S.props[name],d=deed(S,name);
  if(q.owner==null){push(S,{t:'buy',pid:p.id,name:name,price:d.price});return}
  if(q.owner===p.id){
   if(q.mort){log(S,name+' 已抵押,可在「资产」里赎回');ev(S,{k:'note',txt:name+' 抵押中,可以在「资产」里赎回'});return}
   if(q.lvl<4)push(S,{t:'build',pid:p.id,name:name,cost:d.build[q.lvl===3?1:0],to:q.lvl+1,src:'land'});
   else{log(S,name+' 已经是度假村啦');ev(S,{k:'note',txt:name+' 已经是度假村啦!'})}
   return;
  }
  var own=P(S,q.owner);
  if(q.mort&&!S.cfg.mortRent){log(S,name+' 已抵押,免费通行','good');ev(S,{k:'note',txt:'已抵押,免费通行'});say(S,p.id,'freePass');return}
  if(own.sleep>0){log(S,own.name+' 在睡觉,无法收观光费','good');ev(S,{k:'note',txt:own.name+'睡着了,免费通行'});say(S,p.id,'freePass');return}
  if(own.seal>0){log(S,own.name+' 的地产被查封,免收观光费','good');ev(S,{k:'note',txt:'地产被查封,免费通行'});say(S,p.id,'freePass');return}
  var r=rentFor(S,name);
  push(S,{t:'pay',pid:p.id,to:own.id,amount:r.amount,reason:'rent',name:name,rent:r,why:'观光费 · '+name});return;
 }
 if(t==='chance'){push(S,{t:'chance',pid:p.id,stage:'back'});return}
 if(name==='天降横财'){push(S,{t:'windfall',pid:p.id,stage:'roll'});return}
 if(name==='楼市暴跌'){push(S,{t:'pay',pid:p.id,to:'bank',amount:1000,reason:'crash',why:'楼市暴跌 −¥1000'});return}
 if(name==='丢失物品'){var b=prevCity(pos);jump(S,p,b);log(S,p.name+' 丢失物品,返回上一城市 '+DATA.squares[b].name);
   if(S.cfg.lostEffect==='land')landOn(S,p,b,{noSalary:true});return}
 if(name==='酒店'){p.rest=Math.max(p.rest,1);log(S,p.name+' 在酒店歇息一轮','warn');say(S,p.id,'restTurn');return}
 if(name==='休息椅'){p.rest=Math.max(p.rest,1);log(S,p.name+' 坐下休息一轮','warn');say(S,p.id,'restTurn');
   if(S.pot>0)push(S,{t:'gain',pid:p.id,from:'pot',amount:S.pot,why:'奖池 · 休息椅领取'});return}
 if(name==='升级房产'){
  var opts=upgradeOpts(S,p);
  if(!opts.length){log(S,p.name+' 没有可升级的地产,轮空');ev(S,{k:'note',txt:'没有可升级的地产,轮空'});return}
  if(S.cfg.autoResolve&&!opts.some(function(o){return o.cost<=p.cash})){log(S,p.name+' 钱不够升级地产');ev(S,{k:'note',txt:'钱不够升级,轮空'});say(S,p.id,'cantAfford');return}
  push(S,{t:'pick',kind:'prop',purpose:'upgrade',pid:p.id,opts:opts,optional:true,title:'升级房产',text:'选择自己的 1 处地产盖房或升级'});return}
 if(name==='再掷一次'){S.again=true;log(S,p.name+' 再掷一次!','good');return}
 if(t==='airport'){
  push(S,{t:'pick',kind:'dest',purpose:'airport',pid:p.id,opts:destOpts(S),optional:true,title:'飞机场',text:'乘飞机前往任意城市(也可以不飞)'});return}
 // 起点: nothing more
}
function upgradeOpts(S,p){return ownedBy(S,p.id).filter(function(n){var q=S.props[n];return !q.mort&&q.lvl<4}).map(function(n){var q=S.props[n],d=deed(S,n);return{name:n,cost:d.build[q.lvl===3?1:0],to:q.lvl+1}})}
function destOpts(S){return Object.keys(DATA.deeds).sort(function(a,b){return DATA.deeds[a].sq-DATA.deeds[b].sq}).map(function(n){return{name:n,sq:DATA.deeds[n].sq}})}
/* ---------- turn flow ---------- */
function afterQueue(S){ // called whenever q becomes empty during play
 if(S.phase!=='play'||S.q.length||S.tp!=='resolve')return;
 var p=cur(S);
 if(S.again){S.again=false;S.tp='roll';S.roll=null;S.rr=0;p&&log(S,p.name+' 再掷一次','good')}
 else S.tp='end';
}
/* ---------- end-of-turn decision (v10) ----------
   endInfo(S) answers: at the end of the current player's turn (tp==='end'), is there still a meaningful choice?
   auto=true  → the UI advances to the next player by itself (banner ~0.8s, tap to skip)
   auto=false → show the manual 「结束回合」 button; reason/blockers say why. See docs/end-turn-rules.md */
function endInfo(S){
 var r={auto:false,wait:false,reason:'',blockers:[],hints:[],usable:[],held:[]};
 if(S.phase!=='play'||S.tp!=='end'||S.pend){r.wait=true;r.reason=S.pend?'pending':'notEnd';return r}
 var p=cur(S);if(!p||p.out){r.wait=true;r.reason='noPlayer';return r}
 p.hand.forEach(function(c){(canUse(S,p,c)===''?r.usable:r.held).push(c)});
 // 已「看过但没用」的手牌(上次手动结束回合时还拿着的)不再拦住自动结束; 新到手的可用牌会拦一次
 var ack=p.ack||[],fresh=r.usable.filter(function(c){return ack.indexOf(c)<0});
 if(fresh.length)r.blockers.push('card');
 if(r.usable.length&&!fresh.length)r.hints.push('cards')
 if(S.cfg.buildAnywhere&&upgradeOpts(S,p).some(function(o){return o.cost<=p.cash}))r.blockers.push('upgrade');
 var f=finState(S,p.id);
 if(f&&f.id==='danger'){
  var mortable=ownedBy(S,p.id).some(function(n){var q=S.props[n];return !q.mort||q.lvl>0});
  if(mortable&&!p.ackD)r.blockers.push('crisis');
 }
 if(r.held.length)r.hints.push('cards');
 if(!S.cfg.autoEnd){r.reason='manual';r.blockers.unshift('manual');return r}
 if(r.blockers.length){r.reason=r.blockers[0];return r}
 r.auto=true;r.reason='none';return r;
}
/* who will be next (no mutation): {pid, skipped:[{pid,why}]} */
function peekNext(S){
 var a=active(S);if(!a.length)return null;
 var idx=-1;a.forEach(function(p,i){if(p.id===S.turn)idx=i});
 var sl={},rs={},skipped=[],g=0;
 for(;;){idx=(idx+1)%a.length;var p=a[idx];if(++g>a.length*6)return{pid:S.turn,skipped:skipped};
  var sv=sl[p.id]!=null?sl[p.id]:p.sleep,rv=rs[p.id]!=null?rs[p.id]:p.rest;
  if(sv>0){sl[p.id]=sv-1;skipped.push({pid:p.id,why:'睡眠'});continue}
  if(rv>0){rs[p.id]=rv-1;skipped.push({pid:p.id,why:'休息'});continue}
  return{pid:p.id,skipped:skipped}}
}
function popPend(S){S.q.shift();sync(S);afterQueue(S)}
function checkWinner(S){
 var a=active(S);
 if(a.length===1&&S.players.length>1){S.phase='over';S.winner=a[0].id;S.q=[];S.pend=null;log(S,'🏆 '+a[0].name+' 成为超级小富翁!','good');ev(S,{k:'win',pid:a[0].id});say(S,a[0].id,'win');return true}
 return false;
}
function tickEnd(p){if(p.seal>0)p.seal--}
function nextTurn(S){
 var a=active(S);if(!a.length)return;
 var idx=-1;a.forEach(function(p,i){if(p.id===S.turn)idx=i});
 var skipped=[],guard=0,oldIdx=idx;
 for(;;){
  idx=(idx+1)%a.length;var p=a[idx];guard++;
  if(guard>a.length*6)break;
  if(p.sleep>0){p.sleep--;tickEnd(p);skipped.push({pid:p.id,why:'睡眠'});log(S,p.name+' 睡着了,跳过','warn');continue}
  if(p.rest>0){p.rest--;tickEnd(p);skipped.push({pid:p.id,why:'休息'});log(S,p.name+' 休息一轮,跳过','warn');continue}
  S.turn=p.id;if(idx<=oldIdx||a.length===1)S.round=(S.round||1)+1;break;
 }
 S.tp='roll';S.roll=null;S.rr=0;S.again=false;S.q=[];S.pend=null;
 if(skipped.length)ev(S,{k:'skip',list:skipped});
 ev(S,{k:'turn',pid:S.turn});
 if(P(S,S.turn))finTurnLines(S,P(S,S.turn));
}
/* ---------- bankrupt / leave ---------- */
function removePlayer(S,p,creditor,why){
 var cashLeft=p.cash;
 if(cashLeft>0)xfer(S,p.id,creditor!=null?creditor:'bank',cashLeft,why);
 Object.keys(S.props).forEach(function(n){var q=S.props[n];if(q.owner===p.id){if(creditor!=null){q.owner=creditor}else{q.owner=null;q.lvl=0;q.mort=false}}});
 p.hand.forEach(function(c){releaseCard(S,c)});p.hand=[];
 p.out=true;p.rest=p.sleep=p.seal=p.slow=p.rev=p.forced=0;
 // drop pends referring to p
 S.q=S.q.filter(function(x){return x.pid!==p.id});sync(S);
}
function afterRemoval(S,wasCurrent){
 if(checkWinner(S))return;
 if(wasCurrent){S.again=false;nextTurn(S)}
}
/* ---------- chance effects ---------- */
function playersOpts(S,p,incl){return active(S).filter(function(x){return incl||x.id!==p.id}).map(function(x){return x.id})}
function propsOf(S,pid){return ownedBy(S,pid)}
function othersProps(S,pid){return Object.keys(S.props).filter(function(n){var q=S.props[n];return q.owner!=null&&q.owner!==pid}).sort(function(a,b){return DATA.deeds[a].sq-DATA.deeds[b].sq})}
function feeTarget(S){return S.cfg.feeTo==='pot'?'pot':'bank'}
function applyChance(S,p,c){ // immediate effect; may push pends
 var fx=c.fx,d=c.fxd||{};
 function fee(a,payer){push(S,{t:'pay',pid:(payer||p).id,to:feeTarget(S),amount:a,reason:'chance',why:c.title+' · 付 ¥'+a})}
 switch(fx){
 case 'gain_bank':push(S,{t:'gain',pid:p.id,from:'bank',amount:+amountOf(c),why:c.title});break;
 case 'pay_bank':fee(amountOf(c));break;
 case 'gain_bank_all':push(S,{t:'gainAll',pid:p.id,amount:1000,why:c.title});break;
 case 'pay_bank_richest_player':{
   var mx=Math.max.apply(null,active(S).map(function(x){return x.cash}));
   active(S).filter(function(x){return x.cash===mx}).forEach(function(x){fee(1200,x)});break}
 case 'move_to_start_and_collect':{jump(S,p,0);log(S,p.name+' 回到起点');push(S,{t:'gain',pid:p.id,from:'bank',amount:2000,kind:'start',why:'回到原点 · 领取'});break}
 case 'rest':p.rest=Math.max(p.rest,+(d.rounds||1));log(S,p.name+' 原地休息 '+(d.rounds||1)+' 轮','warn');say(S,p.id,'restTurn');break;
 case 'reverse_direction':push(S,{t:'pick',kind:'player',purpose:'reverse',pid:p.id,opts:playersOpts(S,p,true),title:'向后转',text:'指定自己或其他玩家掉头向后转行棋 2 轮'});break;
 case 'seal_all_properties_of_other':{
   var o=playersOpts(S,p).filter(function(id){return ownedBy(S,id).length>0});
   if(!o.length){log(S,'没有人有地产,查封落空');break}
   push(S,{t:'pick',kind:'player',purpose:'seal',pid:p.id,opts:o,title:'查封地产',text:'选一位玩家,他的所有地产 2 轮不能收观光费'});break}
 case 'demolish_property_of_other':{
   var dp=othersProps(S,p.id).filter(function(n){return S.props[n].lvl>0});
   if(!dp.length){log(S,'没有可拆的房产,怪兽扑了个空');break}
   push(S,{t:'pick',kind:'prop',purpose:'monster',pid:p.id,opts:dp.map(function(n){return{name:n,owner:S.props[n].owner,lvl:S.props[n].lvl}}),title:'怪兽来袭!',text:'选一处其他玩家的房产让怪兽拆'});break}
 case 'raise_house_level_color_group':{
   var op=S.cfg.angelScope==='all'?Object.keys(S.props).filter(function(n){return S.props[n].owner!=null}):ownedBy(S,p.id);
   op=op.filter(function(n){return S.props[n].lvl<4||groupMembers(S,n).some(function(m){return S.props[m].lvl<4})});
   if(!op.length){log(S,'没有可提升的地产,天使飞走了');break}
   push(S,{t:'pick',kind:'prop',purpose:'angel',pid:p.id,opts:op.map(function(n){return{name:n,owner:S.props[n].owner,lvl:S.props[n].lvl}}),title:'天使降临',text:'指定一处地产,同色的地产全部提升 '+S.cfg.angelLevels+' 级'});break}
 case 'swap_property':{
   var mine=ownedBy(S,p.id),oth=othersProps(S,p.id);
   if(!mine.length||!oth.length){log(S,'无法交换地产(自己或对方没有地产)');break}
   push(S,{t:'pick',kind:'prop',purpose:'swap1',pid:p.id,opts:mine.map(function(n){return{name:n,owner:p.id,lvl:S.props[n].lvl}}),title:'交换地产 ①',text:'先选自己要换出去的地产'});break}
 }
}
function amountOf(c){if(c.fxd&&c.fxd.amount)return +c.fxd.amount;var m=c.text.match(/[¥￥]?\s*(\d{3,5})\s*元?/);return m?+m[1]:0}
var CARD_AMOUNT={};
/* ---------- hold-card use ---------- */
function canUse(S,p,n){ // returns '' ok or reason
 var c=card(n);if(S.phase!=='play')return '游戏未进行';
 if(p.hand.indexOf(n)<0)return '没有这张卡';
 if(p.id!==S.turn)return '要等到自己的回合才能使用';
 if(c.fx==='waive_one_rent'){return (S.pend&&S.pend.t==='pay'&&S.pend.reason==='rent'&&S.pend.pid===p.id)?'':'只能在要付观光费的时候使用'}
 if(S.pend)return '先完成当前步骤';
 if(c.fx==='dice_bonus')return (S.tp==='rolled'&&S.roll&&!S.roll.bonus)?'':'掷骰后、出发前才能使用';
 if(S.tp!=='roll'&&S.tp!=='end')return '现在不能使用(掷骰前或回合结束前)';
 if(c.fx==='choose_next_roll')return S.tp==='roll'?'':'要在掷骰前使用';
 if(c.fx==='force_buy_property'){return forceOpts(S,p).length?'':'没有可以强买的地产(或钱不够)'}
 if(c.fx==='slow_target'||c.fx==='sleep_other'){return playersOpts(S,p).length?'':'没有可选玩家'}
 return '';
}
function forceOpts(S,p){return othersProps(S,p.id).filter(function(n){return !S.props[n].mort}).map(function(n){var r=rentFor(S,n);return{name:n,owner:S.props[n].owner,lvl:S.props[n].lvl,price:r.amount,ok:p.cash>=r.amount&&r.amount>0}}).filter(function(o){return o.ok})}
function useCard(S,p,n){
 var why=canUse(S,p,n);if(why)return{ok:false,err:why};
 var c=card(n);
 switch(c.fx){
 case 'waive_one_rent':{p.hand.splice(p.hand.indexOf(n),1);releaseCard(S,n);log(S,p.name+' 使用「'+c.title+'」免付观光费','good');ev(S,{k:'note',txt:'免费通行!'});S.q.shift();sync(S);afterQueue(S);return{ok:true}}
 case 'dice_bonus':{p.hand.splice(p.hand.indexOf(n),1);releaseCard(S,n);S.roll.bonus=3;log(S,p.name+' 乘高铁,点数 +3','good');return{ok:true}}
 case 'choose_next_roll':pushFront(S,{t:'pick',kind:'num',purpose:'remote',pid:p.id,card:n,opts:[1,2,3,4,5,6],optional:true,title:c.title,text:'决定下次行棋的步数(1–6)'});return{ok:true};
 case 'force_buy_property':pushFront(S,{t:'pick',kind:'prop',purpose:'force',pid:p.id,card:n,opts:forceOpts(S,p),optional:true,title:c.title,text:'强制购买其他玩家的一处地产,价格=该地产现在的观光费'});return{ok:true};
 case 'slow_target':pushFront(S,{t:'pick',kind:'player',purpose:'slow',pid:p.id,card:n,opts:playersOpts(S,p),optional:true,title:c.title,text:'选一位玩家:他连续 2 轮只能前进一步'});return{ok:true};
 case 'sleep_other':pushFront(S,{t:'pick',kind:'player',purpose:'sleep',pid:p.id,card:n,opts:playersOpts(S,p),optional:true,title:c.title,text:'选一位玩家:他原地睡 2 轮,不能动也不能收观光费'});return{ok:true};
 case 'rewind_one_turn':pushFront(S,{t:'pick',kind:'player',purpose:'rewind',pid:p.id,card:n,opts:playersOpts(S,p,true),optional:true,title:c.title,text:'选一位玩家回到他上一回合开始前的位置'});return{ok:true};
 }
 return{ok:false,err:'这张卡不能这样用'};
}
function consumeHold(S,pd){if(pd.card){var p=P(S,pd.pid),i=p.hand.indexOf(pd.card);if(i>=0)p.hand.splice(i,1);releaseCard(S,pd.card)}}
/* ---------- pick resolution ---------- */
function resolvePick(S,pd,val){
 var p=P(S,pd.pid),pu=pd.purpose;
 function has(x){return pd.opts.some(function(o){return (o&&typeof o==='object')?o.name===x:o===x})}
 if(!has(val))return{ok:false,err:'这个选项不可用'};
 switch(pu){
 case 'remote':p.forced=val;consumeHold(S,pd);log(S,p.name+' 用遥控骰子:下次走 '+val+' 步','good');break;
 case 'slow':{var t=P(S,val);t.slow=2;consumeHold(S,pd);log(S,t.name+' 被龟速:2 轮只能走 1 步','warn');break}
 case 'sleep':{var t2=P(S,val);t2.sleep=2;consumeHold(S,pd);log(S,t2.name+' 睡着了 2 轮','warn');break}
 case 'rewind':{var t3=P(S,val);if(t3.from!=null&&t3.from!==t3.pos){jump(S,t3,t3.from);log(S,t3.name+' 回到上一回合的位置','warn')}else log(S,t3.name+' 位置没变(时光机无效果)');consumeHold(S,pd);break}
 case 'reverse':{var t4=P(S,val);t4.rev=2;log(S,t4.name+' 掉头向后转 2 轮','warn');break}
 case 'seal':{var t5=P(S,val);t5.seal=2;log(S,t5.name+' 的地产被查封 2 轮','warn');break}
 case 'force':{var q=S.props[val],r=rentFor(S,val),ow=q.owner;
   if(p.cash<r.amount)return{ok:false,err:'钱不够'};
   xfer(S,p.id,ow,r.amount,'force');q.owner=p.id;consumeHold(S,pd);log(S,p.name+' 强买 '+val+' ¥'+r.amount,'good');say(S,p.id,'boughtProperty',val);break}
 case 'monster':{var q2=S.props[val];
   if(S.cfg.monster==='all')q2.lvl=0;else q2.lvl=Math.max(0,q2.lvl-1);log(S,'怪兽拆了 '+val+' 的房子','warn');break}
 case 'angel':{var grp=groupMembers(S,val);
   grp.forEach(function(m){var q3=S.props[m];if(q3.owner==null||q3.mort)return;if(S.cfg.angelScope==='own'&&q3.owner!==p.id)return;q3.lvl=Math.min(4,q3.lvl+(+S.cfg.angelLevels||1))});
   log(S,'天使降临:'+val+' 同色地产升级','good');break}
 case 'swap1':{pd.mine=val;pd.purpose='swap2';pd.kind='prop';pd.opts=othersProps(S,p.id).map(function(n){return{name:n,owner:S.props[n].owner,lvl:S.props[n].lvl}});pd.title='交换地产 ②';pd.text='再选对方的地产(对方不能拒绝)';pd.optional=false;sync(S);return{ok:true,stage:2}}
 case 'swap2':{var a=S.props[pd.mine],b=S.props[val],o2=b.owner;a.owner=o2;b.owner=p.id;log(S,p.name+' 用 '+pd.mine+' 换了 '+val,'good');break}
 case 'upgrade':{var q4=S.props[val],dd=deed(S,val),cost=dd.build[q4.lvl===3?1:0];
   if(q4.mort||q4.lvl>=4)return{ok:false,err:'不能升级'};
   if(!xfer(S,p.id,'bank',cost,'build'))return{ok:false,err:'钱不够'};
   q4.lvl++;log(S,p.name+' 升级 '+val+' → '+LVN[q4.lvl],'good');ev(S,{k:'build',name:val});say(S,p.id,'builtUpgrade',val);break}
 case 'airport':{ jump(S,p,DATA.deeds[val].sq);log(S,p.name+' 乘飞机飞往 '+val,'good');S.q.shift();sync(S);landOn(S,p,DATA.deeds[val].sq,{noSalary:true});afterQueue(S);return{ok:true}}
 default:return{ok:false,err:'未知操作'};
 }
 popPend(S);return{ok:true};
}
/* ---------- the action dispatcher ---------- */
function exec(S,type,a){
 a=a||{};
 if(S.phase==='over'&&type!=='nop')return{ok:false,err:'游戏已结束'};
 if(S.phase!=='play'&&['start','nop'].indexOf(type)<0)return{ok:false,err:'游戏还没开始'};
 var p=cur(S),pd=S.pend,r;
 switch(type){
 case 'roll':{
   if(S.tp!=='roll'||pd)return{ok:false,err:'现在不能掷骰'};
   var v=rint(6)+1,forced=0,slow=false;
   if(p.forced){v=p.forced;forced=p.forced;p.forced=0}
   if(p.slow>0){slow=true;p.slow--;v=1}
   S.roll={v:v,bonus:0,dir:p.rev>0?-1:1,forced:forced,slow:slow};S.tp='rolled';
   ev(S,{k:'roll',v:v,pid:p.id,forced:forced,slow:slow});
   log(S,p.name+' 掷出 '+v+(slow?'(龟速:只走1步)':forced?'(遥控)':''));
   if(!slow&&!forced)sayRoll(S,p,v);
   return{ok:true,v:v}}
 case 'reroll':{
   if(S.tp!=='rolled'||pd||!S.roll)return{ok:false,err:'现在不能重掷'};
   if(S.roll.forced)return{ok:false,err:'遥控骰子的点数已经定好了,不能重掷'};
   if(S.roll.slow)return{ok:false,err:'龟速前进只能走 1 步,不能重掷'};
   if(!canReroll(S))return{ok:false,err:'这回合的重掷机会用完啦'};
   var rv=rint(6)+1;S.rr=(S.rr||0)+1;S.roll.v=rv;
   ev(S,{k:'roll',v:rv,pid:p.id,forced:0,slow:false,reroll:true});
   log(S,p.name+' 重掷,这次是 '+rv+'(第 '+S.rr+' 次重掷)');
   sayRoll(S,p,rv);
   return{ok:true,v:rv,left:rerollsLeft(S)}}
 case 'go':{
   if(S.tp!=='rolled'||pd)return{ok:false,err:'现在不能出发'};
   var steps=S.roll.v+S.roll.bonus;if(S.roll.slow)steps=1;
   var dir=S.roll.dir;p.from=p.pos;
   var m=movePlayer(S,p,steps,dir);if(dir<0&&p.rev>0)p.rev--;
   S.roll=null;S.tp='resolve';
   var hotelPass=(S.cfg.hotelRest==='pass'&&m.passHotel);
   if(m.passed){push(S,{t:'gain',pid:p.id,from:'bank',amount:S.cfg.salary*m.passed,kind:'start',why:(p.pos===0?'到达起点':'经过起点')+' · 奖励'})}
   if(hotelPass){p.rest=Math.max(p.rest,1);log(S,p.name+' 路过酒店,歇息一轮','warn')}
   landOn(S,p,p.pos);
   afterQueue(S);
   return{ok:true,path:m.path}}
 case 'ok':{
   if(!pd)return{ok:false,err:'没有待确认的事'};
   var pl=P(S,pd.pid);
   if(pd.t==='gain'){
     if(pd.kind==='start'){var fs1=finState(S,pd.pid);ev(S,{k:'collect',pid:pd.pid,amount:pd.amount,big:!!(fs1&&fs1.id==='danger')})}
     if(!xfer(S,pd.from,pd.pid,pd.amount,'gain'))return{ok:false,err:'银行/奖池不足'};
     log(S,pl.name+' 获得 ¥'+pd.amount+'('+pd.why+')','good');say(S,pd.pid,/起点|原点/.test(pd.why)?'passedStart':'gotMoney',pd.amount);popPend(S);return{ok:true}}
   if(pd.t==='gainAll'){active(S).forEach(function(x){xfer(S,'bank',x.id,pd.amount,'all')});log(S,'共同富裕:每人 +¥'+pd.amount,'good');say(S,pd.pid,'gotMoney',pd.amount);popPend(S);return{ok:true}}
   if(pd.t==='pay'){
     if(pl.cash<pd.amount)return{ok:false,err:'cash',short:pd.amount-pl.cash};
     xfer(S,pd.pid,pd.to,pd.amount,pd.reason);log(S,pl.name+' 支付 ¥'+pd.amount+'('+pd.why+')');
     if(pd.reason==='rent'){say(S,pd.pid,'paidRent',pd.amount);if(typeof pd.to==='number')say(S,pd.to,'receivedRent',pd.amount)}else say(S,pd.pid,'fined',pd.amount);
     popPend(S);return{ok:true}}
   if(pd.t==='buy'){
     if(pl.cash<pd.price)return{ok:false,err:'cash',short:pd.price-pl.cash};
     if(S.props[pd.name].owner!=null)return{ok:false,err:'已有主人'};
     xfer(S,pd.pid,'bank',pd.price,'buy');S.props[pd.name].owner=pd.pid;log(S,pl.name+' 买下 '+pd.name+' ¥'+pd.price,'good');ev(S,{k:'own',name:pd.name,pid:pd.pid});say(S,pd.pid,'boughtProperty',pd.name);popPend(S);return{ok:true}}
   if(pd.t==='build'){
     var q=S.props[pd.name];if(q.lvl+1!==pd.to||q.mort)return{ok:false,err:'状态已变化'};
     if(pl.cash<pd.cost)return{ok:false,err:'cash',short:pd.cost-pl.cash};
     xfer(S,pd.pid,'bank',pd.cost,'build');q.lvl=pd.to;log(S,pl.name+' 在 '+pd.name+' 建成 '+LVN[q.lvl],'good');ev(S,{k:'build',name:pd.name});say(S,pd.pid,'builtUpgrade',pd.name);popPend(S);return{ok:true}}
   if(pd.t==='windfall'&&pd.stage==='pay'){
     xfer(S,'bank',pd.pid,pd.amount,'windfall');log(S,pl.name+' 天降横财 ¥'+pd.amount,'good');say(S,pd.pid,'gotMoney',pd.amount);popPend(S);return{ok:true}}
   if(pd.t==='chance'&&pd.stage==='face'){
     var c=card(pd.card);
     if(c.hold){pl.hand.push(c.n);log(S,pl.name+' 收好「'+c.title+'」','good');S.q.shift();sync(S);afterQueue(S);return{ok:true,held:true}}
     S.q.shift();sync(S);applyChance(S,pl,c);releaseCard(S,c.n);afterQueue(S);sync(S);return{ok:true}}
   return{ok:false,err:'不能这样确认'}}
 case 'no':{ // decline buy / build / optional pick
   if(!pd)return{ok:false,err:'没有待确认的事'};
   if(pd.t==='buy'){log(S,P(S,pd.pid).name+' 放弃购买 '+pd.name);popPend(S);return{ok:true}}
   if(pd.t==='build'){popPend(S);return{ok:true}}
   if(pd.t==='pick'&&pd.optional){popPend(S);return{ok:true}}
   return{ok:false,err:'不能放弃'}}
 case 'flip':{
   if(!pd||pd.t!=='chance'||pd.stage!=='back')return{ok:false,err:'现在不能翻牌'};
   var dc=drawCard(S);if(dc==null){log(S,'机会卡都在大家手里,这次没有卡');popPend(S);return{ok:false,err:'牌堆空了'}}
   pd.card=dc;pd.stage='face';ev(S,{k:'flip',card:pd.card});log(S,P(S,pd.pid).name+' 抽到机会卡「'+card(pd.card).title+'」');return{ok:true,card:pd.card}}
 case 'wroll':{
   if(!pd||pd.t!=='windfall'||pd.stage!=='roll')return{ok:false,err:'现在不能掷'};
   var wv=rint(6)+1;pd.v=wv;pd.amount=wv*100;pd.stage='pay';ev(S,{k:'wroll',v:wv});return{ok:true,v:wv}}
 case 'pick':{
   if(!pd||pd.t!=='pick')return{ok:false,err:'没有待选择的事'};
   r=resolvePick(S,pd,a.value);return r}
 case 'free':{ // use 免费1次 on rent
   if(!pd||pd.t!=='pay'||pd.reason!=='rent')return{ok:false,err:'现在不能用'};
   var pp=P(S,pd.pid),cn=pp.hand.filter(function(n){return card(n).fx==='waive_one_rent'})[0];
   if(!cn)return{ok:false,err:'没有「免费1次!」'};return useCard(S,pp,cn)}
 case 'use':{
   var up=P(S,a.pid);if(!up)return{ok:false,err:'玩家不存在'};return useCard(S,up,a.card)}
 case 'end':{
   if(S.tp!=='end'||pd)return{ok:false,err:'现在不能结束回合'};
   p.ack=p.hand.slice();var fs0=finState(S,p.id);p.ackD=!!(fs0&&fs0.id==='danger');tickEnd(p);log(S,p.name+' 结束回合');nextTurn(S);return{ok:true}}
 case 'bankrupt':{
   if(!pd||pd.t!=='pay'&&pd.t!=='buy'&&pd.t!=='build')return{ok:false,err:'现在不能破产'};
   if(pd.t!=='pay')return{ok:false,err:'只有付不起钱时才能破产'};
   var bp=P(S,pd.pid);if(bp.cash>=pd.amount)return{ok:false,err:'你付得起,不用破产'};
   var cred=typeof pd.to==='number'?pd.to:null;
   var wasCur=bp.id===S.turn;
   log(S,bp.name+' 破产了!'+(cred!=null?' 财产归 '+pname(S,cred):' 财产回到银行'),'warn');
   removePlayer(S,bp,cred,'bankrupt');ev(S,{k:'bankrupt',pid:bp.id,tok:bp.tok,name:bp.name,creditor:cred});say(S,bp.id,'bankruptcy');
   afterRemoval(S,wasCur);if(!wasCur&&S.phase==='play')afterQueue(S);return{ok:true}}
 case 'lucky':{ // 翻身机会: 付不起钱时掷一次幸运骰,5→+500 6→+1000
   if(!pd||pd.t!=='pay')return{ok:false,err:'现在不能用翻身机会'};
   var lp2=P(S,pd.pid);if(lp2.cash>=pd.amount)return{ok:false,err:'你付得起,不用求救'};
   if(S.cfg.luckyRoll===false)return{ok:false,err:'翻身机会没有打开'};
   if(lp2.lucky)return{ok:false,err:'这局的翻身机会已经用过啦'};
   lp2.lucky=1;var lv=rint(6)+1,bonus=lv===6?1000:lv===5?500:0;
   ev(S,{k:'lucky',pid:lp2.id,v:lv,bonus:bonus});log(S,lp2.name+' 用翻身机会掷出 '+lv+(bonus?',获得 ¥'+bonus:',这次没中'),bonus?'good':'warn');
   if(bonus)xfer(S,'bank',lp2.id,bonus,'lucky');
   return{ok:true,v:lv,bonus:bonus}}
 case 'mortgage':{
   var o=P(S,a.pid),n=a.name,q5=S.props[n];if(!q5||q5.owner!==a.pid)return{ok:false,err:'不是你的地产'};if(q5.mort)return{ok:false,err:'已经抵押了'};
   var mv=deed(S,n).mortgage;xfer(S,'bank',o.id,mv,'mort');q5.mort=true;log(S,o.name+' 抵押 '+n+' 得 ¥'+mv);return{ok:true,amount:mv}}
 case 'redeem':{
   var o3=P(S,a.pid),n3=a.name,q6=S.props[n3];if(!q6||q6.owner!==a.pid)return{ok:false,err:'不是你的地产'};if(!q6.mort)return{ok:false,err:'没有抵押'};
   var rc=deed(S,n3).redeem;if(o3.cash<rc)return{ok:false,err:'cash',short:rc-o3.cash};
   xfer(S,o3.id,'bank',rc,'redeem');q6.mort=false;log(S,o3.name+' 赎回 '+n3+' 付 ¥'+rc);return{ok:true,amount:rc}}
 case 'build':{ // manual build (only when cfg.buildAnywhere)
   if(!S.cfg.buildAnywhere)return{ok:false,err:'规则:只能停在自己的地产或「升级房产」格时盖房'};
   var o4=P(S,a.pid),n4=a.name,q7=S.props[n4];if(!q7||q7.owner!==a.pid||q7.mort||q7.lvl>=4)return{ok:false,err:'不能盖'};
   var cst=deed(S,n4).build[q7.lvl===3?1:0];if(!xfer(S,o4.id,'bank',cst,'build'))return{ok:false,err:'cash',short:cst-o4.cash};
   q7.lvl++;log(S,o4.name+' 在 '+n4+' 建成 '+LVN[q7.lvl],'good');ev(S,{k:'build',name:n4});return{ok:true}}
 case 'sellBuilding':{
   var o5=P(S,a.pid),n5=a.name,q8=S.props[n5];if(!q8||q8.owner!==a.pid||q8.lvl<1)return{ok:false,err:'没有房子可拆'};
   var cs=deed(S,n5).build[q8.lvl===4?1:0],rf=Math.floor(cs*S.cfg.refundPct/100);
   q8.lvl--;xfer(S,'bank',o5.id,rf,'sellb');log(S,o5.name+' 拆掉 '+n5+' 一级,退 ¥'+rf);return{ok:true,amount:rf}}
 case 'trade':{ // a:{from,to,give:[names],get:[names],cashGive,cashGet}
   var f=P(S,a.from),t=P(S,a.to);if(!f||!t||f.out||t.out||f===t)return{ok:false,err:'玩家不对'};
   var give=a.give||[],get=a.get||[],cg=+a.cashGive||0,ck=+a.cashGet||0;
   if(cg<0||ck<0)return{ok:false,err:'金额不对'};
   if(!give.every(function(n){return S.props[n]&&S.props[n].owner===f.id})||!get.every(function(n){return S.props[n]&&S.props[n].owner===t.id}))return{ok:false,err:'地产归属有误'};
   if(!give.length&&!get.length&&!cg&&!ck)return{ok:false,err:'没有交易内容'};
   if(f.cash<cg||t.cash<ck)return{ok:false,err:'有人钱不够'};
   if(cg)xfer(S,f.id,t.id,cg,'trade');if(ck)xfer(S,t.id,f.id,ck,'trade');
   give.forEach(function(n){S.props[n].owner=t.id});get.forEach(function(n){S.props[n].owner=f.id});
   log(S,f.name+' ⇄ '+t.name+' 交易完成','good');return{ok:true}}
 case 'join':{
   var jr=addPlayer(S,a.name,a.tok);if(!jr.ok)return jr;
   var jp=P(S,jr.id);jp.from=0;S.fs=S.fs||{};finInit(S);log(S,jp.name+' 加入游戏,领到 ¥'+S.cfg.start+',站在起点','good');ev(S,{k:'join',pid:jp.id});return{ok:true,id:jp.id}}
 case 'leave':{
   var lp=P(S,a.pid);if(!lp||lp.out)return{ok:false,err:'玩家不存在'};
   if(active(S).length<2)return{ok:false,err:'至少要留下 1 位'};
   if(S.pend&&lp.id!==S.turn)return{ok:false,err:'先完成当前步骤'};
   var wc=lp.id===S.turn;log(S,lp.name+' 离开了,财产回到银行','warn');
   removePlayer(S,lp,null,'leave');ev(S,{k:'leave',pid:lp.id});afterRemoval(S,wc);return{ok:true}}
 case 'sync':{ // align with the physical board; no effects, no salary
   var sp=P(S,a.pid);if(!sp||sp.out)return{ok:false,err:'玩家不存在'};

  return el;

 function maybeAutoEnd(){
  clearTimeout(autoEndTimer);dropBanner();
  if(!S||S.phase!=='play'||S.tp!=='end'||S.pend)return;
  var ei=E.endInfo(S);if(!ei.auto)return;
  var turn=S.turn,rd=S.round,quick=UI.reduce();
  function blocked(){return !S||busy||S.phase!=='play'||S.tp!=='end'||S.turn!==turn||S.round!==rd||S.pend||crisisOpen||$('modal').classList.contains('show')}
  function stale(){return !S||S.phase!=='play'||S.tp!=='end'||S.turn!==turn||S.round!==rd}
  function start(){
   if(stale())return;if(blocked()){autoEndTimer=later(start,300);return}
   if(!E.endInfo(S).auto)return;
   var el=nextBanner(),fired=false;
   function fire(){if(fired)return;fired=true;clearTimeout(autoEndTimer);dropBanner();if(stale()||busy||S.pend)return;act('end')}
   if(el&&root&&!quick){root.appendChild(el);banner=el;el.onclick=function(){Sound.tap();fire()};requestAnimationFrame(function(){el.classList.add('on')})}
   autoEndTimer=later(function(){if(blocked()&&!stale()){fired=true;dropBanner();autoEndTimer=later(start,300);return}fire()},quick?60:800);
  }
  autoEndTimer=later(start,quick?20:350);
 }

 function trade(pid){
  var others=E.active(S).filter(function(p){return p.id!==pid}),partner=others[0].id,give={},get={},cg=0,ck=0;
  function draw(){
   var me=P(pid),pt=P(partner);
   function plist(owner,m){var l=E.ownedBy(S,owner);return l.length?l.map(function(n){return '<button class="pit sm'+(m[n]?' on':'')+'" data-n="'+n+'" data-s="'+(m===give?'g':'k')+'"><span class="pchip" style="background:'+DATA.cardHex[DATA.deeds[n].card]+'"></span><span class="pnm">'+n+'</span><span class="plv">'+lvSVG(S.props[n].lvl)+'</span></button>'}).join(''):'<small class="none">没有地产</small>'}
   var h='<h2>玩家交易</h2><div class="stks">'+others.map(function(q){return '<button class="stk'+(q.id===partner?' on':'')+'" data-p="'+q.id+'" style="--pc:'+TKC[q.tok]+'">'+tkAv(q.tok,34)+'</button>'}).join('')+'</div>'+
    '<div class="trc"><div class="trs"><h3>'+esc(me.name)+' 给出</h3><div class="plist col">'+plist(pid,give)+'</div><label>+ 现金 ¥<input id="trG" type="number" inputmode="numeric" min="0" step="100" value="'+(cg||'')+'"></label></div>'+
    '<div class="trs"><h3>'+esc(pt.name)+' 给出</h3><div class="plist col">'+plist(partner,get)+'</div><label>+ 现金 ¥<input id="trK" type="number" inputmode="numeric" min="0" step="100" value="'+(ck||'')+'"></label></div></div>'+
    '<div class="row"><button class="btn" id="trNo">返回</button><button class="btn pri" id="trOk">发起交易</button></div>';
   UI.modal(h,{cls:'sticky assm'});
   Array.prototype.forEach.call($('box').querySelectorAll('.stk'),function(b){b.onclick=function(){partner=+b.getAttribute('data-p');get={};ck=0;cg=+($('trG').value)||0;draw()}});
   Array.prototype.forEach.call($('box').querySelectorAll('.pit[data-n]'),function(b){b.onclick=function(){var n=b.getAttribute('data-n'),m=b.getAttribute('data-s')==='g'?give:get;if(m[n])delete m[n];else m[n]=1;cg=+($('trG').value)||0;ck=+($('trK').value)||0;Sound.tap();draw()}});
   $('trNo').onclick=function(){assets(pid)};
   $('trOk').onclick=function(){
    cg=Math.max(0,+($('trG').value)||0);ck=Math.max(0,+($('trK').value)||0);
    var gv=Object.keys(give),gt=Object.keys(get);
    if(!gv.length&&!gt.length&&!cg&&!ck){UI.toast('先选要交换的东西',1500,'warn');return}
    UI.confirm({title:'请 '+pt.name+' 确认交易',text:esc(me.name)+' 给出:'+(gv.join('、')||'无')+(cg?' + '+Y(cg):'')+'<br>'+esc(pt.name)+' 给出:'+(gt.join('、')||'无')+(ck?' + '+Y(ck):'')+'<br>双方都同意吗?',yes:'双方同意,成交',icon:'users'}).then(function(ok){
     if(!ok){draw();return}
     shownKey='';var r=act('trade',{from:pid,to:partner,give:gv,get:gt,cashGive:cg,cashGet:ck},{noAfter:true});
     if(r.ok){UI.toast('交易成交!',1500,'check');var evs=S.ev.slice();S.ev=[];save();busy=true;playEvents(evs).then(function(){render();assets(pid)})}else draw();
    });
   };
  }
  draw();
 }
 /* ---------- deeds list / editor (待核实) ---------- */
 function flaggedTotal(){var t=0;Object.keys(DATA.deeds).forEach(function(n){t+=E.flaggedCount(S,n)});return t}

 }

 var FLABEL={price:'价格',mortgage:'抵押价值',redeem:'赎回价值',rent0:'空地观光费',rent1:'1间民宿',rent2:'2间民宿',rent3:'3间民宿',rent4:'度假村',build0:'盖1间民宿',build1:'盖1间度假村'};
 function deedEdit(name,from){
  var dd=DATA.deeds[name],col=DATA.cardHex[dd.card];
  var h='<div class="deedc ed" style="--dc:'+col+'"><div class="dh"><b>'+name+'</b><i>'+dd.landmark+'</i></div><div class="dbd">';
  ['rent0','rent1','rent2','rent3','rent4','build0','build1','mortgage','redeem','price'].forEach(function(f){
   var i=E.fieldInfo(S,name,f);
   h+='<div class="fr '+(i.flag||'')+(i.src==='user'?' usr':'')+'"><label>'+FLABEL[f]+'</label><div class="fi"><span>¥</span><input type="number" inputmode="numeric" min="0" step="10" data-f="'+f+'" value="'+i.v+'"></div><div class="fb">'+(i.flag?fbadge(i.flag)+'<button class="btn sm" data-ok="'+f+'">已核对</button>':i.src==='user'?'<em class="vb usr">已修改</em><button class="btn sm" data-rs="'+f+'">还原</button>':'')+'</div></div>';
  });
  h+='<p class="dnote">'+(dd.note?(/[\u4e00-\u9fff]/.test(dd.note)?'照片备注:'+esc(dd.note):'照片中带「待核实」的数字较模糊,已填入参考值,请对照实物卡核对后点「已核对」'):'')+'</p></div></div>';
  var tier=dd.tier&&Object.keys(dd.sug).length;
  h+='<div class="row">'+(tier?'<button class="btn sm" id="dTier">套用同价位「'+dd.tier+'」的数字</button>':'')+'</div><div class="row"><button class="btn" id="deBack">'+(from==='list'?'返回列表':'关闭')+'</button><button class="btn pri" id="deOk">完成</button></div>';
  UI.modal(h,{cls:'deedm ed'});
  var box=$('box');
  Array.prototype.forEach.call(box.querySelectorAll('input[data-f]'),function(inp){inp.onchange=function(){var f=inp.getAttribute('data-f');E.setField(S,name,f,inp.value);save();var sc=box.scrollTop;deedEdit(name,from);box.scrollTop=sc;UI.toast('已保存 '+FLABEL[f],1100,'check')};inp.onclick=function(e){e.stopPropagation()}});
  Array.prototype.forEach.call(box.querySelectorAll('[data-ok]'),function(b){b.onclick=function(){E.confirmField(S,name,b.getAttribute('data-ok'));save();var sc=box.scrollTop;deedEdit(name,from);box.scrollTop=sc}});
  Array.prototype.forEach.call(box.querySelectorAll('[data-rs]'),function(b){b.onclick=function(){E.resetField(S,name,b.getAttribute('data-rs'));save();var sc=box.scrollTop;deedEdit(name,from);box.scrollTop=sc}});
  if(tier)$('dTier').onclick=function(){
   var t=dd.tier,td=E.deed(S,t);
   var fields=Object.keys(dd.sug);fields.forEach(function(f){var m=f.match(/^rent(\d)$/);var v=m?td.rent[+m[1]]:td[f];E.setField(S,name,f,v)});save();deedEdit(name,from);UI.toast('已套用 '+t+' 的数字(仍请核对)',1800,'info')};
  $('deBack').onclick=function(){if(from==='list')deedsList();else{UI.close();shownKey='';render()}};
  $('deOk').onclick=function(){UI.close();shownKey='';render()};
 }

   return '<div class="sec"><h3>'+c[1]+'</h3><div class="seg" data-k="'+c[0]+'">'+c[2].map(function(o){return '<button class="btn'+(String(S.cfg[c[0]])===String(o[0])?' on':'')+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div><small>'+c[3]+'</small></div>'}).join('')+'</div>'+
   '<div class="sec"><h3>固定规则(说明书)</h3><small>每人起始 ¥10,000 · 起点奖励 ¥2,000 · 民宿最多3间,再盖度假村 · 抵押/赎回按地契上印的数字 · 没有监狱、税、拍卖、利息</small></div>'+

   var cur=E.DEF_CFG[k];v=typeof cur==='number'?+v:typeof cur==='boolean'?v==='true':v;S.cfg[k]=v;save();Array.prototype.forEach.call(sg.children,function(c){c.classList.toggle('on',c===t)});Sound.tap()}});

 function logModal(){

 };
